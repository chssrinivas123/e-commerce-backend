spring.application.name=ecommerce
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/srinivas?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:00000}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

server.tomcat.max-http-form-post-size=30MB
server.tomcat.max-swallow-size=30MB
